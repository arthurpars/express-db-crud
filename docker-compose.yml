version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecrud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecrud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecrud_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecrud}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecrud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7-jammy
    container_name: ecrud_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ecrud}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ecrud_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ecrud}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecrud_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ecrud_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecrud_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  redis_data:
